name: Server CI/CD

on:
  pull_request:
    paths:
      - "server/**"
      - "contracts/**"
      - "scripts/validate-cicd.ps1"
      - "infra/windows/**"
      - ".github/workflows/server-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contracts/**"
      - "scripts/validate-cicd.ps1"
      - "infra/windows/**"
      - ".github/workflows/server-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Validate CI/CD contract
        shell: pwsh
        working-directory: .
        run: ./scripts/validate-cicd.ps1

      - name: Test and build production JAR
        run: ./gradlew test bootJar --no-daemon --console=plain

      - name: Create JAR checksum manifest
        run: sha256sum build/libs/moneysnap-server.jar > build/libs/moneysnap-server.jar.sha256

      - name: Upload immutable server JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moneysnap-server-${{ github.sha }}
          path: |
            server/build/libs/moneysnap-server.jar
            server/build/libs/moneysnap-server.jar.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deployment-script-test:
    name: Test Windows deployment behavior
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test checksum, secret ACL, and rollback files
        shell: powershell
        run: ./server/scripts/test-deployment-support.ps1

  deploy-development:
    name: Deploy development origin
    needs: [build, deployment-script-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, moneysnap-dev]
    timeout-minutes: 10
    environment: server-development

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download tested server JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: moneysnap-server-${{ github.sha }}
          path: deployment-artifact

      - name: Deploy, smoke test, and rollback on failure
        shell: powershell
        env:
          NEON_RUNTIME_DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          NEON_RUNTIME_DATABASE_USERNAME: ${{ secrets.NEON_RUNTIME_DATABASE_USERNAME }}
          NEON_RUNTIME_DATABASE_PASSWORD: ${{ secrets.NEON_RUNTIME_DATABASE_PASSWORD }}
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NEON_MIGRATION_DATABASE_USERNAME: ${{ secrets.NEON_MIGRATION_DATABASE_USERNAME }}
          NEON_MIGRATION_DATABASE_PASSWORD: ${{ secrets.NEON_MIGRATION_DATABASE_PASSWORD }}
        run: >-
          ./server/scripts/deploy.ps1
          -ArtifactPath "${{ github.workspace }}\deployment-artifact\moneysnap-server.jar"
          -ChecksumPath "${{ github.workspace }}\deployment-artifact\moneysnap-server.jar.sha256"
          -ReleaseId "${{ github.sha }}"
