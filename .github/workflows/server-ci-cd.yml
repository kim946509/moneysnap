name: Server CI/CD

on:
  pull_request:
    paths:
      - "server/**"
      - "contracts/**"
      - "infra/ubuntu/**"
      - "scripts/validate-cicd.ps1"
      - ".github/workflows/server-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contracts/**"
      - "infra/ubuntu/**"
      - "scripts/validate-cicd.ps1"
      - ".github/workflows/server-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package server image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Validate CI/CD contract
        shell: pwsh
        run: ./scripts/validate-cicd.ps1

      - name: Test Docker deployment behavior
        run: bash server/scripts/test-docker-deployment.sh

      - name: Test and build production JAR
        working-directory: server
        run: ./gradlew test bootJar --no-daemon --console=plain

      - name: Build immutable Docker image
        run: docker build --tag "moneysnap-server:${{ github.sha }}" server

      - name: Create image archive and checksum
        run: |
          mkdir -p deployment-artifact
          docker save "moneysnap-server:${{ github.sha }}" | gzip > deployment-artifact/moneysnap-server.tar.gz
          cd deployment-artifact
          sha256sum moneysnap-server.tar.gz > moneysnap-server.tar.gz.sha256

      - name: Upload immutable server image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moneysnap-server-${{ github.sha }}
          path: |
            deployment-artifact/moneysnap-server.tar.gz
            deployment-artifact/moneysnap-server.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy-development:
    name: Deploy Ubuntu Docker origin
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: server-development

    steps:
      - name: Check out deployment contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download tested server image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: moneysnap-server-${{ github.sha }}
          path: deployment-artifact

      - name: Configure pinned SSH host identity
        env:
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > "$HOME/.ssh/moneysnap-deploy"
          chmod 600 "$HOME/.ssh/moneysnap-deploy"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare runtime secret file
        env:
          NEON_RUNTIME_DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          NEON_RUNTIME_DATABASE_USERNAME: ${{ secrets.NEON_RUNTIME_DATABASE_USERNAME }}
          NEON_RUNTIME_DATABASE_PASSWORD: ${{ secrets.NEON_RUNTIME_DATABASE_PASSWORD }}
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NEON_MIGRATION_DATABASE_USERNAME: ${{ secrets.NEON_MIGRATION_DATABASE_USERNAME }}
          NEON_MIGRATION_DATABASE_PASSWORD: ${{ secrets.NEON_MIGRATION_DATABASE_PASSWORD }}
          APPLE_AUTH_ENABLED: ${{ secrets.APPLE_AUTH_ENABLED }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY_P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
          APPLE_REFRESH_TOKEN_ENCRYPTION_KEY: ${{ secrets.APPLE_REFRESH_TOKEN_ENCRYPTION_KEY }}
          R2_ENABLED: ${{ secrets.R2_ENABLED }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          required_secrets=(
            NEON_RUNTIME_DATABASE_URL
            NEON_RUNTIME_DATABASE_USERNAME
            NEON_RUNTIME_DATABASE_PASSWORD
            NEON_MIGRATION_DATABASE_URL
            NEON_MIGRATION_DATABASE_USERNAME
            NEON_MIGRATION_DATABASE_PASSWORD
            APPLE_AUTH_ENABLED
            APPLE_CLIENT_ID
            APPLE_TEAM_ID
            APPLE_KEY_ID
            APPLE_PRIVATE_KEY_P8
            APPLE_REFRESH_TOKEN_ENCRYPTION_KEY
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "missing required server-development secret: $secret_name" >&2
              exit 1
            fi
          done
          if [[ "$APPLE_AUTH_ENABLED" != "true" && "$APPLE_AUTH_ENABLED" != "false" ]]; then
            echo "APPLE_AUTH_ENABLED must be exactly true or false" >&2
            exit 1
          fi
          r2_enabled=${R2_ENABLED:-false}
          if [[ "$r2_enabled" != "true" && "$r2_enabled" != "false" ]]; then
            echo "R2_ENABLED must be exactly true or false" >&2
            exit 1
          fi
          if [[ "$r2_enabled" == "true" ]]; then
            for secret_name in R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
              if [[ -z "${!secret_name}" ]]; then
                echo "missing required server-development secret: $secret_name" >&2
                exit 1
              fi
            done
          fi
          apple_private_key=${APPLE_PRIVATE_KEY_P8//$'\r'/}
          apple_private_key=${apple_private_key//$'\n'/\\n}
          {
            printf 'NEON_RUNTIME_DATABASE_URL=%s\n' "$NEON_RUNTIME_DATABASE_URL"
            printf 'NEON_RUNTIME_DATABASE_USERNAME=%s\n' "$NEON_RUNTIME_DATABASE_USERNAME"
            printf 'NEON_RUNTIME_DATABASE_PASSWORD=%s\n' "$NEON_RUNTIME_DATABASE_PASSWORD"
            printf 'NEON_MIGRATION_DATABASE_URL=%s\n' "$NEON_MIGRATION_DATABASE_URL"
            printf 'NEON_MIGRATION_DATABASE_USERNAME=%s\n' "$NEON_MIGRATION_DATABASE_USERNAME"
            printf 'NEON_MIGRATION_DATABASE_PASSWORD=%s\n' "$NEON_MIGRATION_DATABASE_PASSWORD"
            printf 'APPLE_AUTH_ENABLED=%s\n' "$APPLE_AUTH_ENABLED"
            printf 'APPLE_CLIENT_ID=%s\n' "$APPLE_CLIENT_ID"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
            printf 'APPLE_KEY_ID=%s\n' "$APPLE_KEY_ID"
            printf 'APPLE_PRIVATE_KEY_P8=%s\n' "$apple_private_key"
            printf 'APPLE_REFRESH_TOKEN_ENCRYPTION_KEY=%s\n' "$APPLE_REFRESH_TOKEN_ENCRYPTION_KEY"
            printf 'R2_ENABLED=%s\n' "$r2_enabled"
            printf 'R2_BUCKET=%s\n' "${R2_BUCKET:-moneysnap-media-dev}"
            printf 'R2_ENDPOINT=%s\n' "${R2_ENDPOINT:-https://6bcae71f04b38cc620c6d3b5bd68cd78.r2.cloudflarestorage.com}"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
          } > "$RUNNER_TEMP/moneysnap-runtime.env"

      - name: Transfer and deploy tested image
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          remote_stage="/tmp/moneysnap-${{ github.sha }}"
          ssh -i "$HOME/.ssh/moneysnap-deploy" -p "$SERVER_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SERVER_SSH_USER@$SERVER_HOST" "install -d -m 700 '$remote_stage'"
          scp -i "$HOME/.ssh/moneysnap-deploy" -P "$SERVER_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deployment-artifact/moneysnap-server.tar.gz \
            deployment-artifact/moneysnap-server.tar.gz.sha256 \
            infra/ubuntu/compose.yaml \
            infra/ubuntu/deploy.sh \
            "$RUNNER_TEMP/moneysnap-runtime.env" \
            "$SERVER_SSH_USER@$SERVER_HOST:$remote_stage/"
          ssh -i "$HOME/.ssh/moneysnap-deploy" -p "$SERVER_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SERVER_SSH_USER@$SERVER_HOST" \
            "bash '$remote_stage/deploy.sh' '$remote_stage/moneysnap-server.tar.gz' '$remote_stage/moneysnap-server.tar.gz.sha256' '$remote_stage/compose.yaml' '$remote_stage/moneysnap-runtime.env' 'moneysnap-server:${{ github.sha }}' '${{ github.sha }}'"

      - name: Verify public application route
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://moneysnap-server.ansandy.co.kr/ \
            | jq --exit-status '.service == "moneysnap-api" and .status == "UP"'
          ! curl --fail --silent --show-error https://moneysnap-server.ansandy.co.kr/actuator/health

      - name: Remove temporary deployment credentials
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/moneysnap-deploy" -p "$SERVER_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SERVER_SSH_USER@$SERVER_HOST" "rm -rf '/tmp/moneysnap-${{ github.sha }}'" || true
          rm -f "$HOME/.ssh/moneysnap-deploy" "$RUNNER_TEMP/moneysnap-runtime.env"
