openapi: 3.1.0
info:
  title: Money Snap API
  version: 0.1.0
  description: Canonical REST contract for the Money Snap iOS MVP.
servers:
  - url: /api/v1
paths:
  /auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange verified Apple credentials for a Money Snap session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleCredentialRequest'
            examples:
              canonical:
                externalValue: ../examples/v1/identity/apple-credential-request.json
      responses:
        '200':
          description: Authenticated Money Snap session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/identity/session-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new Money Snap session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              canonical:
                externalValue: ../examples/v1/identity/refresh-request.json
      responses:
        '200':
          description: Rotated Money Snap session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/identity/session-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current device session.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account:
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated account after Apple reauthentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleCredentialRequest'
            examples:
              canonical:
                externalValue: ../examples/v1/identity/apple-credential-request.json
      responses:
        '204':
          description: Account, user data, and all sessions deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Bearer authentication or Apple reauthentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sessionRejected:
                  externalValue: ../examples/v1/identity/error-session-rejected.json
                appleReauthenticationRejected:
                  externalValue: ../examples/v1/identity/error-apple-reauthentication-rejected.json
        '502':
          description: Apple token revocation failed; the account was preserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/identity/error-apple-revocation-failed.json
  /auth/apple/events:
    post:
      operationId: receiveAppleAccountEvent
      summary: Receive and verify an Apple server-to-server account event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAccountEventRequest'
            examples:
              canonical:
                externalValue: ../examples/v1/identity/apple-account-event-request.json
      responses:
        '200':
          description: Event accepted or already processed.
        '400':
          description: Request validation failed or the verified event type is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  externalValue: ../examples/v1/identity/error-invalid-request.json
                unsupportedEvent:
                  externalValue: ../examples/v1/identity/error-apple-event-unsupported.json
        '401':
          description: The Apple server-to-server event could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/identity/error-apple-event-rejected.json
  /snaps:
    post:
      operationId: recordPersonalSnap
      summary: Record a photo-free personal Snap for the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapRecordRequest'
            examples:
              canonical:
                externalValue: ../examples/v1/snaps/record-request.json
      responses:
        '201':
          description: Personal Snap recorded or an identical mutation replayed.
          headers:
            Location:
              required: true
              schema:
                type: string
              description: Relative path of the stable recorded Snap ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapRecordResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/snaps/record-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The actor already used the mutation ID for a different semantic payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/snaps/error-mutation-conflict.json
        '500':
          description: The request could not be safely persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                canonical:
                  externalValue: ../examples/v1/snaps/error-internal.json
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
  responses:
    BadRequest:
      description: Request validation or semantics failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            canonical:
              externalValue: ../examples/v1/identity/error-invalid-request.json
    Unauthorized:
      description: Authentication credentials are missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            canonical:
              externalValue: ../examples/v1/identity/error-session-rejected.json
  schemas:
    AppleCredentialRequest:
      type: object
      required:
        - identityToken
        - authorizationCode
        - nonce
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 8192
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 2048
        nonce:
          type: string
          minLength: 1
          maxLength: 256
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
    AppleAccountEventRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          type: string
          minLength: 1
          maxLength: 8192
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessExpiresAt
        - refreshToken
        - refreshExpiresAt
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    SnapRecordRequest:
      type: object
      additionalProperties: false
      required:
        - clientMutationId
        - localDay
        - timeZone
        - category
        - amountWon
      properties:
        clientMutationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '.*\S.*'
          description: Actor-scoped opaque idempotency key; UUID syntax is not required.
        localDay:
          type: string
          format: date
        timeZone:
          type: string
          minLength: 1
          description: UTC or an available tzdb region ID containing a slash.
        category:
          type: string
          enum: [food, cafe, transportation, shopping, living, culture, health, other]
        amountWon:
          type: integer
          format: int32
          minimum: 1
          maximum: 999999999
    SnapRecordResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - amountWon
        - localDay
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [food, cafe, transportation, shopping, living, culture, health, other]
        amountWon:
          type: integer
          format: int32
          minimum: 1
          maximum: 999999999
        localDay:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - correlationId
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - INVALID_REQUEST
            - SESSION_REJECTED
            - MUTATION_CONFLICT
            - INTERNAL_ERROR
            - APPLE_REAUTHENTICATION_REJECTED
            - APPLE_REVOCATION_FAILED
            - APPLE_EVENT_REJECTED
            - APPLE_EVENT_UNSUPPORTED
        correlationId:
          type: string
          format: uuid
          description: Identifier used to correlate the failed request with server logs.
