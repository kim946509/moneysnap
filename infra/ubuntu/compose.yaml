services:
  server:
    image: ${MONEYSNAP_IMAGE:?MONEYSNAP_IMAGE is required}
    container_name: moneysnap-server
    restart: unless-stopped
    env_file:
      - ${MONEYSNAP_ENV_FILE:-/opt/moneysnap/runtime.env}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_PORT: "9091"
      MONEYSNAP_SQLITE_URL: jdbc:sqlite:file:/var/lib/moneysnap/moneysnap.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    ports:
      - "192.168.1.102:9090:8080"
    expose:
      - "9091"
    volumes:
      - ${MONEYSNAP_DATA_DIR:-/opt/moneysnap/data}:/var/lib/moneysnap
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0

networks:
  monitoring:
    external: true
    name: main
