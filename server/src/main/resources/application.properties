spring.application.name=moneysnap-api
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${NEON_RUNTIME_DATABASE_URL}
spring.datasource.username=${NEON_RUNTIME_DATABASE_USERNAME}
spring.datasource.password=${NEON_RUNTIME_DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.url=${NEON_MIGRATION_DATABASE_URL}
spring.flyway.user=${NEON_MIGRATION_DATABASE_USERNAME}
spring.flyway.password=${NEON_MIGRATION_DATABASE_PASSWORD}

moneysnap.apple.enabled=${APPLE_AUTH_ENABLED:false}
moneysnap.apple.client-id=${APPLE_CLIENT_ID:}
moneysnap.apple.team-id=${APPLE_TEAM_ID:}
moneysnap.apple.key-id=${APPLE_KEY_ID:}
moneysnap.apple.private-key=${APPLE_PRIVATE_KEY_P8:}
moneysnap.apple.refresh-token-encryption-key=${APPLE_REFRESH_TOKEN_ENCRYPTION_KEY:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}
